[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trailsport"
version = "0.2.0"
description = "Trail-running race time prediction from your own GPX history"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scikit-learn",
    "lightgbm",
    "requests",
    "gpxpy",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
trailsport = "trailsport.cli:main"

[tool.setuptools]
packages = ["trailsport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
